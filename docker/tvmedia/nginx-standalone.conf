server {
    listen 80;
    server_name _;
    root /var/www/tvmedia/public;
    index index.php index.html;

    # Serve uploaded media
    location /storage/tvmedia/ {
        alias /var/www/storage/tvmedia/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Route semua ke index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # TV Media SPA — di-serve via PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=80M\npost_max_size=82M\nmemory_limit=128M";
    }

    # Deny akses ke file berbahaya
    location ~ /\. { deny all; }
}
