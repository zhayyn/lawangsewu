version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lawangsewu-app
    container_name: lawangsewu-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - lawangsewu-network

  web:
    image: nginx:alpine
    container_name: lawangsewu-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lawangsewu-network
    depends_on:
      - app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lawangsewu-worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    networks:
      - lawangsewu-network
    depends_on:
      - app
      - redis
      - db

  db:
    image: mysql:8.0
    container_name: lawangsewu-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lawangsewu}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-lawangsewu}
    volumes:
      - lawangsewu-mysql-data:/var/lib/mysql
    networks:
      - lawangsewu-network
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine
    container_name: lawangsewu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - lawangsewu-redis-data:/data
    networks:
      - lawangsewu-network

networks:
  lawangsewu-network:
    driver: bridge

volumes:
  lawangsewu-mysql-data:
  lawangsewu-redis-data:
