[program:lawangsewu-reverb]
directory=/var/www/lawangsewu
command=/usr/bin/php /var/www/lawangsewu/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/lawangsewu/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
environment=APP_ENV="production"
