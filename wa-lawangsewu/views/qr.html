<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>WA-Caraka | Scan QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #c9d1d9;
        }
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-direction: column;
            text-align: center;
        }
        .glass-card {
            background: rgba(22, 27, 34, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem 3rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            animation: glow 4s infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 10px rgba(88, 166, 255, 0.2), 0 8px 32px 0 rgba(0, 0, 0, 0.5); }
            to { box-shadow: 0 0 25px rgba(88, 166, 255, 0.6), 0 8px 32px 0 rgba(0, 0, 0, 0.5); }
        }
        h2 {
            margin: 0 0 20px 0;
            font-size: 1.5rem;
            font-weight: 700;
            background: -webkit-linear-gradient(#58a6ff, #39d353);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .qr-wrapper {
            background: white;
            padding: 15px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }
        #qrcode {
            display: block;
            width: 250px;
            height: 250px;
            object-fit: cover;
        }
        #pesan {
            margin: 10px 0 0 0;
            font-size: 1rem;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="container">
        <div class="glass-card">
            <h2>WA-CARAKA BINDING</h2>
            <div class="qr-wrapper">
                <img id="qrcode" src="assets/img/scan-qr-code-5.gif" alt="Harap tunggu..." />
            </div>
            <p id="pesan">Inisialisasi sistem...</p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        // Particles JS init
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 50, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": ["#58a6ff", "#39d353"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": false },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#58a6ff", "opacity": 0.4, "width": 1 },
                "move": { "enable": true, "speed": 1.5, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": false } } },
            "retina_detect": true
        });

        // Socket IO init
        var socket = io({path: "/socket/", transports: ["websocket"]});
        const urlParams = new URLSearchParams(window.location.search);
        const session = urlParams.get('session');
        
        socket.on(`${session}_qr`, (qr) => {
            $("#qrcode").attr("src", qr);
            $("#pesan").text("Arahkan kamera WhatsApp Anda");
        });
        
        socket.on(`${session}_ready`, (msg) =>{
            $("#qrcode").attr("src", "assets/img/ready-3.gif");
            $("#pesan").html("<span style='color: #39d353'>Hubungan Terjalin. Sistem Siap!</span>");
        });
    </script>
</body>
</html>
