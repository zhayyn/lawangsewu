[program:lawangsewu-queue]
directory=/var/www/lawangsewu
command=/usr/bin/php /var/www/lawangsewu/artisan queue:work database --queue=default --sleep=1 --tries=3 --backoff=5 --timeout=120 --max-jobs=500 --max-time=3600 --memory=256 --no-interaction
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/lawangsewu/queue-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=360
environment=APP_ENV="production"
