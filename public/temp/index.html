<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>WA-Caraka | Lawangsewu Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #c9d1d9;
        }
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-direction: column;
            text-align: center;
        }
        .glass-card {
            background: rgba(22, 27, 34, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem 4rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            animation: glow 4s infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 10px rgba(88, 166, 255, 0.2), 0 8px 32px 0 rgba(0, 0, 0, 0.5); }
            to { box-shadow: 0 0 25px rgba(88, 166, 255, 0.6), 0 8px 32px 0 rgba(0, 0, 0, 0.5); }
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            font-weight: 700;
            background: -webkit-linear-gradient(#58a6ff, #39d353);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        h2 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 300;
            color: #8b949e;
            letter-spacing: 1px;
        }
        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #39d353;
            box-shadow: 0 0 10px #39d353;
            margin-right: 10px;
            animation: blink 2s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .status {
            margin-top: 30px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signature {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #484f58;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="container">
        <div class="glass-card">
            <h1>WA-CARAKA</h1>
            <h2>WhatsApp Messenger Engine</h2>
            <div class="status">
                <span class="pulse"></span> System Online & Ready
            </div>
            <div class="signature">// developed by dbprakom™</div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": ["#58a6ff", "#39d353"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": false },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#58a6ff", "opacity": 0.4, "width": 1 },
                "move": { "enable": true, "speed": 2, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
                "modes": { "repulse": { "distance": 100, "duration": 0.4 }, "push": { "particles_nb": 4 } }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
