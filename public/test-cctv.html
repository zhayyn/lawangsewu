<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test CCTV HLS Lawangsewu</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                linear-gradient(135deg, rgba(14, 165, 233, 0.12), transparent 35%),
                linear-gradient(315deg, rgba(16, 185, 129, 0.14), transparent 38%),
                #f8fafc;
        }

        main {
            width: min(1080px, 100%);
            border: 1px solid rgba(14, 165, 233, 0.24);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
            overflow: hidden;
            backdrop-filter: blur(18px);
        }

        header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(14, 165, 233, 0.18);
        }

        h1 {
            margin: 0;
            font-size: 18px;
            line-height: 1.2;
        }

        p {
            margin: 6px 0 0;
            color: #475569;
            font-size: 13px;
        }

        .status {
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 999px;
            padding: 8px 12px;
            color: #047857;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
            background: rgba(236, 253, 245, 0.8);
        }

        .player {
            padding: 18px;
        }

        video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            background: #020617;
            outline: 1px solid rgba(15, 23, 42, 0.1);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        button {
            border: 1px solid rgba(14, 165, 233, 0.35);
            border-radius: 10px;
            padding: 10px 14px;
            color: #0369a1;
            background: rgba(240, 249, 255, 0.92);
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            border-color: rgba(14, 165, 233, 0.7);
            background: #e0f2fe;
        }

        code {
            color: #7c3aed;
            word-break: break-all;
            font-size: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                background: #020617;
                color: #f8fafc;
            }

            body {
                background:
                    linear-gradient(135deg, rgba(14, 165, 233, 0.2), transparent 34%),
                    linear-gradient(315deg, rgba(124, 58, 237, 0.2), transparent 38%),
                    #020617;
            }

            main {
                border-color: rgba(125, 211, 252, 0.22);
                background: rgba(15, 23, 42, 0.82);
                box-shadow: none;
            }

            header {
                border-bottom-color: rgba(125, 211, 252, 0.14);
            }

            p {
                color: #cbd5e1;
            }

            .status {
                color: #86efac;
                border-color: rgba(134, 239, 172, 0.26);
                background: rgba(20, 83, 45, 0.28);
            }

            button {
                color: #bae6fd;
                border-color: rgba(125, 211, 252, 0.28);
                background: rgba(14, 165, 233, 0.12);
            }

            button:hover {
                background: rgba(14, 165, 233, 0.2);
            }

            code {
                color: #c4b5fd;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div>
                <h1>Test CCTV HLS Lawangsewu</h1>
                <p>Preview memakai SD. Fullscreen otomatis pindah ke HD, keluar fullscreen kembali ke SD.</p>
            </div>
            <div id="status" class="status">Menyiapkan player...</div>
        </header>

        <section class="player">
            <video id="cctv-video" controls autoplay muted playsinline></video>

            <div class="controls">
                <button id="fullscreen-button" type="button">Fullscreen HD</button>
                <code id="source-label">/cctv/kepaniteraan-sd/index.m3u8</code>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
    <script>
        const streams = {
            sd: '/cctv/kepaniteraan-sd/index.m3u8',
            hd: '/cctv/kepaniteraan-hd/index.m3u8',
        };

        const video = document.getElementById('cctv-video');
        const statusEl = document.getElementById('status');
        const sourceLabel = document.getElementById('source-label');
        const fullscreenButton = document.getElementById('fullscreen-button');
        let hls = null;
        let activeQuality = '';

        function setStatus(message) {
            statusEl.textContent = message;
        }

        function loadStream(quality) {
            if (activeQuality === quality) {
                return;
            }

            activeQuality = quality;
            const source = streams[quality];
            sourceLabel.textContent = source;
            setStatus(quality === 'hd' ? 'Memuat HD...' : 'Memuat SD...');

            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                video.play().catch(() => setStatus('Klik play untuk mulai.'));
                setStatus(quality.toUpperCase() + ' aktif');
                return;
            }

            if (window.Hls && window.Hls.isSupported()) {
                hls = new window.Hls({
                    lowLatencyMode: true,
                    backBufferLength: 30,
                });
                hls.loadSource(source);
                hls.attachMedia(video);
                hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => setStatus('Klik play untuk mulai.'));
                    setStatus(quality.toUpperCase() + ' aktif');
                });
                hls.on(window.Hls.Events.ERROR, (event, data) => {
                    if (data && data.fatal) {
                        setStatus('Stream error: ' + data.type);
                    }
                });
                return;
            }

            setStatus('Browser tidak mendukung HLS.');
        }

        fullscreenButton.addEventListener('click', async () => {
            const target = video.requestFullscreen ? video : document.documentElement;

            try {
                if (!document.fullscreenElement) {
                    await target.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                setStatus('Fullscreen gagal dibuka.');
            }
        });

        document.addEventListener('fullscreenchange', () => {
            const nextQuality = document.fullscreenElement ? 'hd' : 'sd';
            window.setTimeout(() => loadStream(nextQuality), 500);
        });

        loadStream('sd');
    </script>
</body>
</html>
