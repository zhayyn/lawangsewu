<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Socket.IO chat</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #form {
      background: rgba(0, 0, 0, 0.15);
      padding: 0.25rem;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      height: 3rem;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
    }

    #input {
      border: none;
      padding: 0 1rem;
      flex-grow: 1;
      border-radius: 2rem;
      margin: 0.25rem;
    }

    #input:focus {
      outline: none;
    }

    #form>button {
      background: #333;
      border: none;
      padding: 0 1rem;
      margin: 0.25rem;
      border-radius: 3px;
      outline: none;
      color: #fff;
    }

    #messages {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    #messages>li {
      padding: 0.5rem 1rem;
    }

    #messages>li:nth-child(odd) {
      background: #efefef;
    }

    .qr-code-container {
      display: flex;
      justify-content: center;
      /*align-items: center;*/
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<body>
  <div class="qr-code-container">
    <div class="qr-code">
      <img src="assets/img/scan-qr-code.gif" alt="Silakan tunggu qrcode untuk tampil" title="Silakan tunggu qrcode untuk tampil" id="qrcode" />
    </div>
  </div>
</body>

<script>
  var socket = io({path: "/socket/", transports: ["websocket"]});
  const urlParams = new URLSearchParams(window.location.search);
  const client_id = urlParams.get('client_id');
  socket.on(`${client_id}_qr`, (qr) => {
    $("#qrcode").attr("src", qr);
    $("#qrcode").attr("alt","Harap scan qrcode ini untuk mengaktifkan sesi whatsapp anda");
    $("#qrcode").attr("title","Harap scan qrcode ini untuk mengaktifkan sesi whatsapp anda");
  })
  socket.on(`${client_id}_authenticated`, (msg) =>{
    d = new Date();
    $("#qrcode").attr("src", "assets/img/loading.gif");
    $("#qrcode").attr("alt",msg);
    $("#qrcode").attr("title",msg);
  })
  socket.on(`${client_id}_ready`, (msg) =>{
    d = new Date();
    $("#qrcode").attr("src", "assets/img/ready.gif");
    $("#qrcode").attr("alt",msg);
    $("#qrcode").attr("title",msg);
  })
</script>

</html>
